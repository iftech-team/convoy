<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6B78E6"/>
      <stop offset="1" stop-color="#3D47A8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="18" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- macOS squircle -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="412" rx="186" fill="url(#sheen)"/>
  <!-- Three chevrons in convoy: leading one solid, followers lighter -->
  <g filter="url(#shadow)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="86">
    <path d="M300 340 L472 512 L300 684" stroke="#ffffff" stroke-opacity="0.45"/>
    <path d="M440 340 L612 512 L440 684" stroke="#ffffff" stroke-opacity="0.7"/>
    <path d="M580 340 L752 512 L580 684" stroke="#ffffff"/>
  </g>
</svg>
