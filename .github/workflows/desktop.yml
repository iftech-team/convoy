name: Desktop preview
on:
  push:
    paths: ['apps/desktop/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['apps/desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential libx11-dev libxkbfile-dev libfuse2 xvfb
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Windows PTY smoke test
        if: runner.os == 'Windows'
        run: npm run test:pty
      - name: Linux PTY smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:pty
      - name: Windows UI smoke test
        if: runner.os == 'Windows'
        run: npm run test:ui
      - name: Linux UI smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:ui
      - name: Windows app lifecycle test
        if: runner.os == 'Windows'
        run: npm run test:app
      - name: Linux app lifecycle test
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:app
      - run: npm run package -- --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: convoy-preview-${{ runner.os }}-x64
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error
