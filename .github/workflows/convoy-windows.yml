name: Convoy Windows
on:
  push:
    paths: ['apps/convoy/**', 'apps/linux/crates/convoy-core/**', 'apps/linux/Cargo.*', '.github/workflows/convoy-windows.yml']
  pull_request:
    paths: ['apps/convoy/**', 'apps/linux/crates/convoy-core/**', 'apps/linux/Cargo.*', '.github/workflows/convoy-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/convoy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/convoy/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/convoy/src-tauri
            apps/linux
      - run: npm ci
      - run: npx playwright install chromium
      - name: Folder and review UI flows
        run: npm run test:ui
      - name: Windows core compiles (including test targets)
        run: cargo check --manifest-path ../linux/Cargo.toml -p convoy-core --tests --locked
      - name: Native and npm executable resolution
        run: cargo test --manifest-path ../linux/Cargo.toml -p convoy-core --lib platform::tests --locked
      - name: ConPTY input/output and workspace/review lifecycle
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build Windows application
        run: npm run tauri -- build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: convoy-windows-installer
          path: apps/convoy/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
