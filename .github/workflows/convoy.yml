name: Convoy client

# The Tauri client for Windows and Linux. It shares `convoy-core` with the GTK
# client, so a change to the core is checked by both workflows.
on:
  push:
    branches: [main, linux-gtk-port]
    paths:
      - 'apps/convoy/**'
      - 'apps/linux/crates/convoy-core/**'
      - '.github/workflows/convoy.yml'
  pull_request:
    paths:
      - 'apps/convoy/**'
      - 'apps/linux/crates/convoy-core/**'
      - '.github/workflows/convoy.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/convoy

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the web view and its dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/convoy/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/convoy/src-tauri

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui

      - name: Formatting
        working-directory: apps/convoy/src-tauri
        run: cargo fmt --all -- --check

      - name: Lints
        working-directory: apps/convoy/src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The terminal path without a window: a command runs, its output comes
      # back, input reaches it, and stopping takes the whole process tree.
      - name: Tests
        working-directory: apps/convoy/src-tauri
        run: cargo test --workspace

      - name: Front end builds
        run: npm run build

  build:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the web view and its dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/convoy/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/convoy/src-tauri

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run build

      - name: Build the release binary
        working-directory: apps/convoy/src-tauri
        run: cargo build --release

      - name: Report the binary size
        run: ls -lh src-tauri/target/release/convoy-tauri

      - uses: actions/upload-artifact@v4
        with:
          name: convoy-tauri-linux
          path: apps/convoy/src-tauri/target/release/convoy-tauri
          if-no-files-found: error

  # Windows is half the point of this client, so it is built where it runs.
  # The launch path, the terminal and the stop path all have Windows branches
  # that no amount of Linux CI would compile.
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/convoy/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/convoy/src-tauri

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui

      - name: Formatting
        working-directory: apps/convoy/src-tauri
        run: cargo fmt --all -- --check

      - name: Lints
        working-directory: apps/convoy/src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      # ConPTY rather than a pty: a command runs, input reaches it, the exit
      # code comes back, stopping says it was asked for, and hibernating is
      # reported apart from it.
      #
      # `convoy-pty` alone, because a test binary that links the web view
      # cannot be loaded here at all — it dies with STATUS_ENTRYPOINT_NOT_FOUND
      # before a single test runs. That is the reason the terminal is its own
      # package.
      - name: Terminal tests
        working-directory: apps/convoy/src-tauri
        run: cargo test -p convoy-pty

      # The shared rules, run natively: PATH resolution, %APPDATA%, the status
      # line quoting. These have Windows branches that are exercised from Linux
      # by passing a platform, and here by actually being on one.
      - name: Core tests
        working-directory: apps/linux
        run: cargo test -p convoy-core

      - run: npm run build

      - name: Build the installer
        run: npm run tauri build -- --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: convoy-windows-installer
          path: apps/convoy/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
