name: Convoy client

# The Tauri client for Windows and Linux. It shares `convoy-core` with the GTK
# client, so a change to the core is checked by both workflows.
on:
  push:
    branches: [main, linux-gtk-port]
    paths:
      - 'apps/convoy/**'
      - 'apps/linux/crates/convoy-core/**'
      - '.github/workflows/convoy.yml'
  pull_request:
    paths:
      - 'apps/convoy/**'
      - 'apps/linux/crates/convoy-core/**'
      - '.github/workflows/convoy.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/convoy

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the web view and its dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/convoy/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/convoy/src-tauri

      - run: npm ci

      - name: Formatting
        working-directory: apps/convoy/src-tauri
        run: cargo fmt --all -- --check

      - name: Lints
        working-directory: apps/convoy/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # The terminal path without a window: a command runs, its output comes
      # back, input reaches it, and stopping takes the whole process tree.
      - name: Terminal tests
        working-directory: apps/convoy/src-tauri
        run: cargo test

      - name: Front end builds
        run: npm run build

  build:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the web view and its dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/convoy/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/convoy/src-tauri

      - run: npm ci
      - run: npm run build

      - name: Build the release binary
        working-directory: apps/convoy/src-tauri
        run: cargo build --release

      - name: Report the binary size
        run: ls -lh src-tauri/target/release/convoy-tauri

      - uses: actions/upload-artifact@v4
        with:
          name: convoy-tauri-linux
          path: apps/convoy/src-tauri/target/release/convoy-tauri
          if-no-files-found: error

  # Windows is half the point of this client, so it is built where it runs.
  # The launch path, the terminal and the stop path all have Windows branches
  # that no amount of Linux CI would compile.
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/convoy/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/convoy/src-tauri

      - run: npm ci

      - name: Formatting
        working-directory: apps/convoy/src-tauri
        run: cargo fmt --all -- --check

      - name: Lints
        working-directory: apps/convoy/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # ConPTY rather than a pty: a command runs, input reaches it, the exit
      # code comes back, and stopping clears the session.
      #
      # The test binary is built into target\debug\deps, and nothing puts
      # WebView2Loader.dll beside it — the copy for this architecture is left
      # under the webview2-com-sys build directory. Windows searches the
      # executable's own folder first, finds some other loader along the way,
      # and the harness dies with STATUS_ENTRYPOINT_NOT_FOUND before a single
      # test runs. Putting the right one next to the binary settles it.
      - name: Terminal tests
        working-directory: apps/convoy/src-tauri
        shell: pwsh
        run: |
          cargo build --tests
          $loader = Get-ChildItem -Recurse -Filter WebView2Loader.dll target\debug\build |
            Where-Object { $_.FullName -like '*\x64\*' } | Select-Object -First 1
          if ($loader) { Copy-Item $loader.FullName target\debug\deps\ -Force }
          $exe = Get-ChildItem target\debug\deps\convoy_tauri-*.exe |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $dumpbin = Get-ChildItem "C:\Program Files*\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($exe -and $dumpbin) { & $dumpbin.FullName /dependents $exe.FullName }
          cargo test

      # The shared rules, run natively: PATH resolution, %APPDATA%, the status
      # line quoting. These have Windows branches that are exercised from Linux
      # by passing a platform, and here by actually being on one.
      - name: Core tests
        working-directory: apps/linux
        run: cargo test -p convoy-core

      - run: npm run build

      - name: Build the installer
        run: npm run tauri build -- --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: convoy-windows-installer
          path: apps/convoy/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
