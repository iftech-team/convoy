name: Publish desktop preview
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Desktop preview run on main
        required: true
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: desktop-preview-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Verify the tested source
        id: source
        uses: actions/github-script@v7
        env:
          RUN_ID: ${{ inputs.run_id }}
        with:
          script: |
            if (!/^\d+$/.test(process.env.RUN_ID)) throw new Error('Expected a numeric run ID');
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: Number(process.env.RUN_ID)
            });
            if (run.path !== '.github/workflows/desktop.yml' || run.head_branch !== 'main' ||
                run.head_repository.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                !['push', 'workflow_dispatch'].includes(run.event) ||
                run.status !== 'completed' || run.conclusion !== 'success') {
              throw new Error('Only a successful Desktop preview run on main can be published');
            }
            const { data: file } = await github.rest.repos.getContent({
              ...context.repo, path: 'apps/desktop/package.json', ref: run.head_sha
            });
            const { version } = JSON.parse(Buffer.from(file.content, 'base64').toString());
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Invalid preview version');
            core.setOutput('version', version);
            core.setOutput('sha', run.head_sha);
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: convoy-preview-*-x64
          merge-multiple: true
          path: installers
      - name: Publish tested installers as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.source.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          cd installers
          files=("Convoy-Preview-${VERSION}-win-x64.exe" "Convoy-Preview-${VERSION}-linux-x64.AppImage" "Convoy-Preview-${VERSION}-linux-x64.deb")
          for file in "${files[@]}"; do test -s "$file"; done
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat > notes.md <<'NOTES'
          First Electron preview for Windows and Linux (x64).

          Includes projects, saved Claude Code/Codex sessions, two terminal panes, Git worktrees, tasks, specs, agent status and Files & Changes. Some native macOS features are still being ported.

          - Windows: run the .exe installer. This preview is unsigned.
          - Linux: install the .deb package, or make the AppImage executable and run it. Some distributions require FUSE.
          - Install Git and sign in to Claude Code or Codex CLI. Install GitHub CLI (gh) for pull requests.

          Native macOS continues on its separate stable release. These installers are published unchanged from CI after unit, PTY, UI and app lifecycle checks on Windows and Ubuntu 22.04. SHA256SUMS.txt contains the installer checksums.
          NOTES
          printf '\nSource: %s\nBuild: https://github.com/%s/actions/runs/%s\n' "$SOURCE_SHA" "$GH_REPO" "$RUN_ID" >> notes.md
          gh release create "desktop-v${VERSION}" "${files[@]}" SHA256SUMS.txt \
            --target "$SOURCE_SHA" --title "Convoy Desktop Preview ${VERSION}" \
            --prerelease --latest=false --notes-file notes.md
