[package]
name = "convoy-tauri"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[lib]
name = "convoy_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Every rule already lives here, with no toolkit dependency. That is what makes
# swapping the front end cost three days rather than three months.
convoy-core = { path = "../../linux/crates/convoy-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Native folder pickers, a save dialog for Markdown export, and desktop
# notifications. Each is a separate plugin so the capability file can name
# exactly what the window is allowed to do.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# wezterm's pty layer: a real pty on Unix and ConPTY on Windows, which is the
# piece that makes one terminal implementation serve both.
portable-pty = "0.9"
# The Recycle Bin on Windows and the freedesktop trash on Linux. Hand-written
# FFI for the Windows shell API is not something to ship onto a machine I
# cannot run it on.
trash = "5.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The `test` feature gives a real AppHandle, so the terminal tests go
# through the same event channel the window uses.
tauri = { version = "2", features = ["test"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
