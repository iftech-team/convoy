[package]
name = "convoy-gtk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "convoy_gtk"
path = "src/lib.rs"

[[bin]]
name = "convoy"
path = "src/main.rs"

[[bin]]
name = "convoy-vte-probe"
path = "src/bin/vte-probe.rs"

[[bin]]
name = "convoy-vte-selftest"
path = "src/bin/vte-selftest.rs"

[dependencies]
convoy-core = { path = "../convoy-core" }
gtk.workspace = true
adw.workspace = true
vte4.workspace = true
sourceview.workspace = true
glib.workspace = true
gio.workspace = true
async-channel.workspace = true
pulldown-cmark.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[[test]]
name = "ui"
path = "tests/ui.rs"
# GTK must run on the main thread, and only one instance may be initialised
# per process, so this target supplies its own main rather than using the
# default test harness.
harness = false
