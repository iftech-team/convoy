[workspace]
resolver = "2"
members = ["crates/convoy-core", "crates/convoy-gtk"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/iftech/convoy"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
regex = "1"
tempfile = "3"
libc = "0.2"
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
vte4 = { version = "0.10", features = ["v0_84", "gtk_v4_18"] }
sourceview = { package = "sourceview5", version = "0.11", features = ["v5_12"] }
glib = "0.22"
gio = "0.22"
async-channel = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
